<h1>ReSello – tuoteraidan koristeet</h1>
<p class="hint">Lisää <b>logoja</b> ja <b>hehkuja</b> raidalle, raahaa paikalleen ja säädä <b>koko</b> ja <b>kääntö</b>. Valittua voi <b>monistaa</b> tai <b>poistaa</b>. Logot ovat valkoisia, hehkut valkoisia 68&nbsp;% läpinäkyvyydellä. Kun valmista, paina <b>Kopioi</b> ja liitä tähän chattiin.</p>

var stage=document.getElementById('stage');
var items=[]; var sel=null; var nid=1; var drag=null;

function makeEl(it){
  var el=document.createElement('div'); el.className='item '+it.type; el.dataset.id=it.id;
  var img=document.createElement('img'); img.src=SRC[it.type]; el.appendChild(img);
  el.addEventListener('pointerdown',function(ev){ev.preventDefault();ev.stopPropagation();select(it.id);
    var p=pt(ev); drag={id:it.id,dx:p.x-it.x,dy:p.y-it.y}; try{stage.setPointerCapture(ev.pointerId);}catch(e){}});
  stage.appendChild(el); it.el=el; place(it);
}
function place(it){ it.el.style.left=it.x+'%'; it.el.style.top=it.y+'%'; it.el.style.width=it.s+'%';
  it.el.style.transform='translate(-50%,-50%) rotate('+it.rot+'deg)'; }
function add(type,x,y){ var it={id:nid++,type:type,x:x||50,y:y||50,s:type==='glow'?9:7,rot:0}; items.push(it); makeEl(it); select(it.id); writeOut(); }
function select(id){ sel=id;
  items.forEach(function(it){it.el.classList.toggle('sel',it.id===id);});
  var it=cur();
  ['cWrap','rWrap'].forEach(function(x){document.getElementById(x).hidden=!it;});
  ['dup','del'].forEach(function(x){document.getElementById(x).hidden=!it;});
  document.getElementById('who').textContent= it? (it.type==='logo'?'Logo #':'Hehku #')+it.id : 'Ei valittu';
  if(it){ csize.value=it.s; vsize.textContent=it.s+'%'; crot.value=it.rot; vrot.textContent=it.rot+'°'; }
}
function cur(){ return items.find(function(i){return i.id===sel;}); }
function pt(ev){ var r=stage.getBoundingClientRect(); return {x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100}; }
stage.addEventListener('pointermove',function(ev){ if(!drag)return; ev.preventDefault(); var it=items.find(function(i){return i.id===drag.id;}); if(!it)return;
  var p=pt(ev); it.x=Math.max(0,Math.min(100,+(p.x-drag.dx).toFixed(2))); it.y=Math.max(0,Math.min(100,+(p.y-drag.dy).toFixed(2))); place(it); writeOut(); });
addEventListener('pointerup',function(){drag=null;});
stage.addEventListener('pointerdown',function(ev){ if(ev.target===stage||ev.target.id==='bg'){ select(null); writeOut(); } });

document.getElementById('addLogo').onclick=function(){add('logo',30+Math.random()*40,40+Math.random()*20);};
document.getElementById('addGlow').onclick=function(){add('glow',30+Math.random()*40,40+Math.random()*20);};
csize.addEventListener('input',function(){var it=cur();if(!it)return;it.s=+this.value;vsize.textContent=this.value+'%';place(it);writeOut();});
crot.addEventListener('input',function(){var it=cur();if(!it)return;it.rot=+this.value;vrot.textContent=this.value+'°';place(it);writeOut();});
document.getElementById('dup').onclick=function(){var it=cur();if(!it)return;var n={id:nid++,type:it.type,x:Math.min(97,it.x+4),y:Math.min(97,it.y+4),s:it.s,rot:it.rot};items.push(n);makeEl(n);select(n.id);writeOut();};
document.getElementById('del').onclick=function(){var it=cur();if(!it)return;it.el.remove();items=items.filter(function(i){return i.id!==it.id;});select(null);writeOut();};
document.getElementById('clear').onclick=function(){items.forEach(function(i){i.el.remove();});items=[];select(null);writeOut();};

function writeOut(){
  var lines=['# Tuoteraidan koristeet (x,y=keskipiste % raidasta; koko=% leveydestä; valkoinen, hehku 68%)'];
  items.forEach(function(it){ lines.push(it.type+': x='+it.x+'% y='+it.y+'% koko='+it.s+'% kaanto='+it.rot+'°'); });
  if(!items.length) lines.push('(ei koristeita)');
  document.getElementById('out').value=lines.join('\n');
}
document.getElementById('copy').onclick=function(){var o=document.getElementById('out');o.select();document.execCommand('copy');this.textContent='Kopioitu!';var b=this;setTimeout(function(){b.textContent='Kopioi';},1200);};
writeOut();
</script>
