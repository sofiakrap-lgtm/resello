<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReSello – leima-editori</title>
<style>
  :root{--beige:#FAF1E0;--brown:#3C2415;--cream:#FFFDF8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9ddc7;font-family:'Segoe UI',system-ui,sans-serif;color:var(--brown);padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
  h1{font-size:1.05rem;font-weight:700}
  .hint{font-size:.82rem;opacity:.75;max-width:52rem;text-align:center;line-height:1.5}
  .wrap{width:100%;max-width:1000px}
  .stage{position:relative;width:100%;aspect-ratio:1000/680;background:var(--brown);border-radius:22px;box-shadow:0 10px 30px rgba(60,36,21,.25);overflow:hidden;touch-action:none;color:var(--beige)}
  /* viitteellinen keskiö (ei muokattava) */
  .ref{position:absolute;inset:0;pointer-events:none;opacity:.85}
  .ref .h{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-style:italic;font-weight:700;font-size:clamp(14px,2.6vw,30px);white-space:nowrap}
  .ref .tbl{position:absolute;top:33%;left:50%;transform:translateX(-50%);width:42%;display:flex;flex-direction:column;gap:5px}
  .ref .row{border:1.5px solid rgba(250,241,224,.5);border-radius:9px;height:min(5.4vw,34px)}
  .ref .lm{position:absolute;top:80%;left:50%;transform:translateX(-50%);width:42%;display:flex;gap:6px}
  .ref .lm b{flex:1;border:1.5px solid rgba(250,241,224,.5);border-radius:9px;height:min(8vw,52px)}
  .leima{position:absolute;cursor:grab;user-select:none;touch-action:none;will-change:transform}
  .leima img{width:100%;height:auto;display:block;pointer-events:none}
  .leima.sel{outline:2px dashed #ffd9a6;outline-offset:3px;border-radius:6px}
  .leima.spin img{animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .panel{width:100%;max-width:1000px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--cream);border:1.5px solid #d9c6a8;border-radius:12px;padding:12px 14px}
  .panel.dim{opacity:.5}
  .panel .who{font-weight:700;font-size:.9rem;min-width:9rem}
  .ctl{display:flex;align-items:center;gap:8px;font-size:.82rem}
  .ctl input[type=range]{width:150px}
  .ctl .val{min-width:3.2rem;text-align:right;font-variant-numeric:tabular-nums}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button.tool{font-size:.82rem;padding:.5rem .9rem;border-radius:10px;border:1.5px solid var(--brown);background:var(--cream);color:var(--brown);cursor:pointer;font-weight:600}
  button.tool:hover{background:var(--beige)}
  textarea{width:100%;max-width:1000px;height:150px;font-family:ui-monospace,monospace;font-size:.74rem;border-radius:12px;border:1.5px solid #c9b7a0;padding:10px;background:#fff;color:var(--brown);resize:vertical}
</style>

<h1>ReSello – leima-editori</h1>
<p class="hint">Raahaa leimoja hiirellä. Valitse leima klikkaamalla, säädä kokoa ja kääntöä alla olevilla liukusäätimillä. Alhaalta saat valmiit CSS-koordinaatit (leveys ja sijainti suhteessa hinnastolohkoon).</p>

<div class="wrap">
 <div class="stage" id="stage">
  <div class="ref">
    <div class="h">Pay just by your size</div>
    <div class="tbl"><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div></div>
    <div class="lm"><b></b><b></b><b></b><b></b></div>
  </div>
 </div>
</div>

<div class="panel dim" id="panel">
  <span class="who" id="who">Valitse leima klikkaamalla</span>
  <label class="ctl">Koko <input type="range" id="size" min="3" max="30" step="0.2" disabled><span class="val" id="sizev">–</span></label>
  <label class="ctl">Kääntö <input type="range" id="rot" min="-180" max="180" step="1" disabled><span class="val" id="rotv">–</span></label>
</div>

<div class="toolbar">
  <button class="tool" id="copy">Kopioi CSS</button>
  <button class="tool" id="reset">Palauta alkuarvot</button>
</div>
<textarea id="out" readonly></textarea>

let L=JSON.parse(JSON.stringify(DEF));
const stage=document.getElementById('stage');
const panel=document.getElementById('panel'), who=document.getElementById('who');
const size=document.getElementById('size'), sizev=document.getElementById('sizev');
const rot=document.getElementById('rot'), rotv=document.getElementById('rotv');
let sel=null, drag=null;

function build(){
  L.forEach(function(o){
    var d=document.createElement('div'); d.className='leima'+(o.spin?' spin':''); d.dataset.id=o.id;
    var im=document.createElement('img'); im.src=o.src; d.appendChild(im);
    stage.appendChild(d); o.el=d;
    d.addEventListener('pointerdown',function(ev){ start(ev,o); });
  });
  layout();
}
function layout(){
  L.forEach(function(o){
    o.el.style.width=o.w+'%';
    o.el.style.left=o.x+'%'; o.el.style.top=o.y+'%';
    o.el.style.transform='translate(-50%,-50%) rotate('+o.rot+'deg)';
    o.el.classList.toggle('sel', sel===o);
  });
  writeOut();
}
function start(ev,o){
  ev.preventDefault(); select(o);
  var r=stage.getBoundingClientRect();
  drag={o:o, dx:(ev.clientX-r.left)/r.width*100 - o.x, dy:(ev.clientY-r.top)/r.height*100 - o.y};
  stage.setPointerCapture&&stage.setPointerCapture(ev.pointerId);
}
function move(ev){
  if(!drag)return; ev.preventDefault();
  var r=stage.getBoundingClientRect();
  var nx=(ev.clientX-r.left)/r.width*100 - drag.dx;
  var ny=(ev.clientY-r.top)/r.height*100 - drag.dy;
  drag.o.x=Math.max(-8,Math.min(108,+nx.toFixed(1)));
  drag.o.y=Math.max(-8,Math.min(108,+ny.toFixed(1)));
  layout();
}
function end(){ drag=null; }
stage.addEventListener('pointermove',move);
addEventListener('pointerup',end);

function select(o){
  sel=o; panel.classList.remove('dim'); who.textContent=o.name;
  size.disabled=false; rot.disabled=false;
  size.value=o.w; sizev.textContent=o.w.toFixed(1)+'%';
  rot.value=o.rot; rotv.textContent=o.rot+'°';
  layout();
}
size.addEventListener('input',function(){ if(!sel)return; sel.w=+size.value; sizev.textContent=sel.w.toFixed(1)+'%'; layout(); });
rot.addEventListener('input',function(){ if(!sel)return; sel.rot=+rot.value; rotv.textContent=sel.rot+'°'; layout(); });

function writeOut(){
  var t='/* Leima-koordinaatit (sijainti = keskipiste, leveys = % hinnastolohkosta) */\n';
  L.forEach(function(o){
    var cls = o.id==='stamp' ? '.pp-stamp' : '.pp-spin';
    t+=cls+'{left:'+o.x+'%;top:'+o.y+'%;width:'+o.w.toFixed(1)+'%;transform:translate(-50%,-50%) rotate('+o.rot+'deg)}\n';
  });
  document.getElementById('out').value=t;
}
document.getElementById('reset').onclick=function(){ L.forEach(function(o){o.el.remove();}); L=JSON.parse(JSON.stringify(DEF)); sel=null; panel.classList.add('dim'); who.textContent='Valitse leima klikkaamalla'; size.disabled=rot.disabled=true; size.value=10; rot.value=0; sizev.textContent=rotv.textContent='–'; build(); };
document.getElementById('copy').onclick=function(){ var o=document.getElementById('out'); o.select(); document.execCommand('copy'); this.textContent='Kopioitu!'; var b=this; setTimeout(function(){b.textContent='Kopioi CSS';},1200); };
stage.addEventListener('pointerdown',function(ev){ if(ev.target===stage||ev.target.closest('.ref')){ sel=null; panel.classList.add('dim'); who.textContent='Valitse leima klikkaamalla'; size.disabled=rot.disabled=true; layout(); } });
build();
