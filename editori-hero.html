<title>ReSella hero-editori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#3E2520; --panel-2:#4B302A; --line:#5E433B; --ink:#ECECDC; --muted:#CDBFB2;
  --stage:#D9D8C6; --accent:#C24029; --track:#6E5E56;
  --fd:"Archivo","Arial Black",system-ui,sans-serif; --fb:"Epilogue",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.45 var(--fb);color:#3E2520;background:var(--stage)}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100%}
/* ----- control panel ----- */
.panel{background:var(--panel);color:var(--ink);padding:20px max(18px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.panel h1{font-family:var(--fd);font-weight:900;text-transform:uppercase;font-size:19px;letter-spacing:.3px;line-height:1.05}
.panel .intro{color:var(--muted);font-size:13px;font-weight:300}
.devrow{display:flex;gap:8px}
.devbtn{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 10px;font:500 13px var(--fb);cursor:pointer}
.devbtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ctrl{display:flex;flex-direction:column;gap:7px;padding-top:14px;border-top:1px solid var(--line)}
.ctrl .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ctrl label{font-weight:500;font-size:14px}
.ctrl .val{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl .hint{color:var(--muted);font-size:12px;font-weight:300;margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:999px;background:var(--track);outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);cursor:pointer}
input[type=range]:focus-visible{outline:2px solid #C5D0D3;outline-offset:3px}
.actions{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line);margin-top:auto}
.btn{border:0;border-radius:999px;padding:11px 16px;font:500 14px var(--fb);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:#ECECDC}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.copied{font-size:12px;color:#D09C4C;text-align:center;min-height:14px;font-weight:500}
/* ----- stage ----- */
.stage{position:relative;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}
.frame{background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgb(62 37 32 / .22);width:1180px;max-width:100%;transition:width .26s cubic-bezier(0,0,.2,1)}
.frame.mobile{width:390px}
.frame iframe{display:block;width:100%;height:760px;border:0;background:#3E2520}
.stagehint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;color:#6E5E56;pointer-events:none}
@media(max-width:800px){
  .app{grid-template-columns:1fr}
  .panel{order:2}
  .stage{order:1;padding:14px}
  .actions{margin-top:0}
}
</style>

<div class="app">
  <aside class="panel">
    <div>
      <h1>Hero-editori</h1>
      <p class="intro">Säädä liukusäätimillä. Muutos näkyy heti oikealla. Kun olet tyytyväinen, paina Kopioi arvot ja näytä ne minulle.</p>
    </div>
    <div class="devrow">
      <button class="devbtn on" id="dev-desk">Työpöytä</button>
      <button class="devbtn" id="dev-mob">Mobiili</button>
    </div>

    <div class="ctrl">
      <div class="top"><label for="s-title">Otsikon koko</label><span class="val" id="v-title">46px</span></div>
      <input type="range" id="s-title" min="24" max="80" step="1" value="46">
      <p class="hint">KASSA, / JOKA TUO OSTAJIA</p>
    </div>

    <div class="ctrl">
      <div class="top"><label for="s-pb">Otsikko alareunasta</label><span class="val" id="v-pb">0px</span></div>
      <input type="range" id="s-pb" min="0" max="80" step="1" value="0">
      <p class="hint">0 = kiinni alareunassa</p>
    </div>

    <div class="ctrl">
      <div class="top"><label for="s-mb">Napit alareunasta</label><span class="val" id="v-mb">22px</span></div>
      <input type="range" id="s-mb" min="0" max="80" step="1" value="22">
      <p class="hint">Ingressin ja nappien korkeus</p>
    </div>

    <div class="ctrl">
      <div class="top"><label for="s-gap">Väli seuraavaan osaan</label><span class="val" id="v-gap">40px</span></div>
      <input type="range" id="s-gap" min="0" max="140" step="1" value="40">
      <p class="hint">Heron ja seuraavan osan väli</p>
    </div>

    <div class="actions">
      <button class="btn primary" id="copy">Kopioi arvot</button>
      <button class="btn ghost" id="reset">Palauta oletukset</button>
      <div class="copied" id="copied"></div>
    </div>
  </aside>

  <div class="stage">
    <div class="stagehint" id="shint"></div>
    <div class="frame" id="frame">
      <iframe id="pv" title="Esikatselu"></iframe>
    </div>
  </div>
</div>

<style>
:root{

  --radius-pill:999px;--radius-card:24px;
  --fd:"Archivo","Arial Black",system-ui,sans-serif;--fb:"Epilogue",system-ui,-apple-system,sans-serif;
  /* editoitavat arvot */
  --ed-title-size:46px; --ed-hero-pb:0px; --ed-right-mb:22px; --ed-foot-pt:40px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--fd);font-stretch:125%;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.3px}
.sub{font-weight:300;color:var(--ink-muted)}
.btn{--h:40px;--px:22px;--fs:15px;padding:calc((var(--h) - var(--fs)*.7)/2 - 1px) var(--px);font:500 var(--fs)/1 var(--fb);border-radius:var(--radius-pill);border:1px solid transparent;display:inline-block;white-space:nowrap;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.s{--h:30px;--px:14px;--fs:13px}
.btn.out{background:transparent;color:var(--ink);border-color:var(--ink)}
/* header */
.hdr{position:absolute;inset:0 0 auto 0;z-index:40;padding:12px clamp(14px,2.5vw,22px)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr .logo{height:42px}
.hdr-right{display:flex;align-items:center;gap:14px}
.hdr .demo{background:transparent;border:1px solid var(--bg);color:var(--bg);font-weight:500}
.burger{width:28px;height:21px;border:0;background:none;padding:0;color:var(--bg)}
.burger rect{fill:currentColor}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:var(--ink)}
.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-tint{position:absolute;inset:0;z-index:1;background:rgb(0 0 0 / .18)}
.hero-in{position:relative;z-index:2;width:100%;padding:120px clamp(18px,3vw,38px) var(--ed-hero-pb);color:var(--bg)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:clamp(24px,5vw,72px)}
.hero-title{display:flex;flex-direction:column}
.hero-title .disp{display:block;color:var(--bg);font-size:var(--ed-title-size);white-space:nowrap}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:18px;max-width:42ch;margin-bottom:var(--ed-right-mb)}
.hero-right .lead{font-size:clamp(15px,2vw,18px);color:rgb(236 236 220 / .92);font-weight:300}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hero-cta .btn{background:var(--bg);color:var(--ink)}
.hero-cta .btn.out{background:transparent;color:var(--bg);border-color:rgb(236 236 220 / .6)}
/* footer */
.foot{padding:var(--ed-foot-pt) 0 28px;font-size:14px}
.foot-inner{padding-inline:clamp(18px,3vw,38px)}
.foot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(24px,5vw,64px);padding-bottom:clamp(28px,4vw,40px)}
.foot-intro{max-width:34ch}
.foot-intro .head{font-family:var(--fd);font-stretch:125%;font-weight:500;font-size:20px;margin-bottom:14px;line-height:1.15}
.foot-cols{display:flex;gap:clamp(36px,6vw,72px)}
.foot-col b{font-weight:500;display:block;margin-bottom:8px}
.foot-col a{display:block;color:var(--ink-muted);padding:3px 0}
.foot .biglogo{height:34px;width:auto;margin-bottom:10px}
.foot-legal{border-top:1px solid var(--ink);padding-top:14px;display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
@media(max-width:620px){
  .hero-row{flex-direction:column;align-items:flex-start;gap:26px}
  .hero-right{align-items:flex-start;text-align:left;max-width:none}
  .hero-cta{justify-content:flex-start}
  .foot-top{flex-direction:column;gap:28px}
  .foot-cols{gap:48px}
}
</style></head>

<script>
(function(){
  "use strict";
  var pv = document.getElementById('pv');
  var srcEl = document.getElementById('preview-src');
  pv.srcdoc = srcEl.textContent;

  var DEFAULTS = {title:46, pb:0, mb:22, gap:40};
  var state = Object.assign({}, DEFAULTS);
  var map = {title:'--ed-title-size', pb:'--ed-hero-pb', mb:'--ed-right-mb', gap:'--ed-foot-pt'};

  function apply(){
    var d = pv.contentDocument;
    if(!d || !d.documentElement) return;
    for(var k in map){ d.documentElement.style.setProperty(map[k], state[k]+'px'); }
  }
  function sync(){
    document.getElementById('v-title').textContent = state.title+'px';
    document.getElementById('v-pb').textContent = state.pb+'px';
    document.getElementById('v-mb').textContent = state.mb+'px';
    document.getElementById('v-gap').textContent = state.gap+'px';
    document.getElementById('s-title').value = state.title;
    document.getElementById('s-pb').value = state.pb;
    document.getElementById('s-mb').value = state.mb;
    document.getElementById('s-gap').value = state.gap;
  }
  pv.addEventListener('load', function(){ apply(); });

  function bind(id, key){
    document.getElementById(id).addEventListener('input', function(e){
      state[key] = parseInt(e.target.value,10);
      sync(); apply();
    });
  }
  bind('s-title','title'); bind('s-pb','pb'); bind('s-mb','mb'); bind('s-gap','gap');

  // device toggle
  var frame = document.getElementById('frame');
  var shint = document.getElementById('shint');
  function setDev(mob){
    frame.classList.toggle('mobile', mob);
    document.getElementById('dev-desk').classList.toggle('on', !mob);
    document.getElementById('dev-mob').classList.toggle('on', mob);
    shint.textContent = mob ? 'Mobiilinäkymä (390px) · vieritä nähdäksesi footerin' : 'Työpöytänäkymä · vieritä nähdäksesi footerin';
  }
  document.getElementById('dev-desk').addEventListener('click', function(){ setDev(false); });
  document.getElementById('dev-mob').addEventListener('click', function(){ setDev(true); });
  setDev(false);

  // copy
  document.getElementById('copy').addEventListener('click', function(){
    var txt = 'ReSella hero-arvot:\n'+
      'Otsikon koko: '+state.title+'px\n'+
      'Otsikko alareunasta: '+state.pb+'px\n'+
      'Napit alareunasta: '+state.mb+'px\n'+
      'Väli seuraavaan osaan: '+state.gap+'px';
    var done = function(){ document.getElementById('copied').textContent = 'Kopioitu. Liitä se minulle.'; setTimeout(function(){document.getElementById('copied').textContent='';},3000); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
    } else { fallback(txt, done); }
  });
  function fallback(txt, done){
    try{ var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); done(); }
    catch(e){ document.getElementById('copied').textContent='Kopiointi ei onnistunut'; }
  }
  // reset
  document.getElementById('reset').addEventListener('click', function(){
    state = Object.assign({}, DEFAULTS); sync(); apply();
  });

  sync();
})();
</script>
